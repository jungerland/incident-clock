<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Interpreter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same design system as the Grit Remover demo: its palette, IBM Plex type, rounded panels and pills.
   Layout: a single working column with a memo tab and a demo tab. */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --ink: #142030;
  --muted: #5a6779;
  --line: #dde2ea;
  --accent: #2b5a8e;
  --accent-soft: #e6eef8;
  --ok: #1b7650;
  --ok-soft: #e3f3ea;
  --warn: #865500;
  --warn-soft: #fbf0d9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --ink: #e5eaf1; --muted: #93a0b2; --line: #263140;
    --accent: #84aee0; --accent-soft: #1b2a3d; --ok: #55c08f; --ok-soft: #13291f; --warn: #e3a943; --warn-soft: #2e2412;
    --bad: #f2776c; --bad-soft: #351816; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --ink: #e5eaf1; --muted: #93a0b2; --line: #263140;
  --accent: #84aee0; --accent-soft: #1b2a3d; --ok: #55c08f; --ok-soft: #13291f; --warn: #e3a943; --warn-soft: #2e2412;
  --bad: #f2776c; --bad-soft: #351816; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
h2 { font-size: 1.15rem; font-weight: 600; }
.eyebrow { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.subtitle { margin: 0; font-size: 1.15rem; font-weight: 500; color: var(--muted); }

header { display: grid; gap: 12px; margin-bottom: 24px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.tab { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 0.9rem; }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }

.label { margin: 0 0 8px; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 22px; max-width: 76ch; margin: 0 0 24px; }
.controls { display: flex; flex-wrap: wrap; gap: 16px 32px; margin-bottom: 28px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.84rem; font-weight: 500; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.headline { font-size: 1.15rem; font-weight: 600; margin: 0 0 14px; text-wrap: balance; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.desk { border-collapse: collapse; width: 100%; min-width: 880px; }
.desk th { text-align: left; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.desk td { vertical-align: top; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.desk tr:last-child td { border-bottom: 0; }
.desk td:first-child { font-weight: 600; width: 13%; }
.pill { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.yes, .pill.later { background: var(--warn-soft); color: var(--warn); }
.pill.no { background: var(--ok-soft); color: var(--ok); }
.pill.late, .pill.soon { background: var(--bad-soft); color: var(--bad); }
.when { font: 500 0.92rem var(--font-mono); font-variant-numeric: tabular-nums; display: block; margin-bottom: 6px; }
.small { color: var(--muted); font-size: 0.82rem; }
.actions { margin: 0; padding-left: 16px; }
.actions li + li { margin-top: 4px; }
.sec { font: 0.76rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.finding { background: var(--warn-soft); border-radius: 10px; padding: 14px 22px; margin: 16px 0 0; max-width: 76ch; font-size: 0.9rem; }

h2.customers { margin: 40px 0 14px; }
.list { display: grid; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
details + details { border-top: 1px solid var(--line); }
summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
summary:hover { background: var(--bg); }
.detail { padding: 4px 16px 18px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); font-size: 0.88rem; }
@media (max-width: 820px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.detail h3 { font-size: 0.82rem; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.detail section + section { margin-top: 18px; }
.detail ul { margin: 0; padding-left: 16px; }
.detail li + li { margin-top: 6px; }
.quote { color: var(--muted); font-size: 0.82rem; display: block; margin-top: 1px; }
.draft { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font: 0.76rem/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.draftmark { color: var(--bad); font-weight: 600; font-size: 0.72rem; margin: 0 0 6px; }
.note { color: var(--muted); font-size: 0.82rem; max-width: 80ch; margin-top: 24px; }

#memo-panel { max-width: 800px; font-size: 1.05rem; line-height: 1.6; }
#memo-panel h2 { margin: 32px 0 10px; }
#memo-panel p, #memo-panel ul, #memo-panel ol { max-width: 68ch; margin: 0 0 14px; }
#memo-panel li + li { margin-top: 6px; }
#memo-panel li > ul { margin: 6px 0 0; }
#memo-panel .tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 18px 0; }
#memo-panel table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.88rem; line-height: 1.45; }
#memo-panel th { text-align: left; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); }
#memo-panel td { vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--line); }
#memo-panel tr:last-child td { border-bottom: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Prototype · Incident response</span>
    <h1>Incident Interpreter</h1>
    <p class="subtitle">What your contracts require, and by when</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Page">
    <button class="tab" role="tab" id="tab-memo" aria-controls="memo-panel">Memo</button>
    <button class="tab" role="tab" id="tab-demo" aria-controls="demo-panel">Demo</button>
  </nav>

  <article id="memo-panel" role="tabpanel" aria-labelledby="tab-memo"><!--MEMO--></article>

  <main id="demo-panel" role="tabpanel" aria-labelledby="tab-demo">
    <p class="label eyebrow">What the agent was told</p>
    <blockquote class="report" id="report"></blockquote>

    <div class="controls">
      <div>
        <p class="label eyebrow">Time now, Pacific</p>
        <div class="seg" id="times"></div>
      </div>
      <div>
        <p class="label eyebrow">Health system's data</p>
        <div class="seg" id="methods"></div>
      </div>
    </div>

    <p class="headline" id="headline"></p>
    <div class="tablewrap">
      <table class="desk">
        <thead><tr><th>Customer</th><th>Notify?</th><th>Why</th><th>Deadline</th><th>Do first</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="finding" id="finding"></p>

    <h2 class="customers">Contract wording, flags for legal, and draft notices</h2>
    <div class="list" id="details"></div>

    <p class="note" id="note"></p>
  </main>
</div>

<script id="data" type="application/json"><!--DATA--></script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const TIMES = [
  { label: "Nov 2, 4 PM", at: "2026-11-02T16:00:00-08:00" },
  { label: "Nov 2, 7 PM", at: "2026-11-02T19:00:00-08:00" },
  { label: "Nov 3, 4 PM", at: "2026-11-03T16:00:00-08:00" },
];
const METHODS = [
  { id: "base", label: "Safe Harbor (recorded run)" },
  { id: "flip", label: "Limited data set (test change)" },
];
let timeIndex = 0, method = "base";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function hoursLeft(deadline, now) { return (new Date(deadline) - new Date(now)) / 3600000; }
function leftWords(h) {
  if (h < 0) return "overdue by " + Math.round(-h) + (Math.round(-h) === 1 ? " hour" : " hours");
  return Math.round(h) + (Math.round(h) === 1 ? " hour left" : " hours left");
}
function leftClass(h) { return h < 0 ? "late" : h <= 4 ? "soon" : "later"; }

function currentRows() {
  return DATA.rows.map(r => r.contract === "AHS" && method === "flip" ? DATA.flip : r);
}

function renderSeg(id, items, isOn, onPick, labelOf) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  items.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = labelOf(item);
    b.setAttribute("aria-pressed", isOn(item, i) ? "true" : "false");
    b.addEventListener("click", () => { onPick(item, i); render(); });
    el.appendChild(b);
  });
}

function list(items, fn) { return "<ul>" + items.map(x => "<li>" + fn(x) + "</li>").join("") + "</ul>"; }
function cited(c) {
  return esc(c.point) + ' <span class="sec">' + esc(c.section) + '</span><span class="quote">"' + esc(c.quote) + '"</span>';
}

function render() {
  renderSeg("times", TIMES, (_, i) => i === timeIndex, (_, i) => { timeIndex = i; }, t => t.label);
  renderSeg("methods", METHODS, m => m.id === method, m => { method = m.id; }, m => m.label);
  const now = TIMES[timeIndex].at;
  const rows = currentRows();
  const notify = rows.filter(r => r.notify === "yes");
  const open = notify.filter(r => r.deadline).sort((a, b) => a.deadline.localeCompare(b.deadline));
  let head = notify.length + " to notify, " + (rows.length - notify.length) + " with no notice owed.";
  const next = open.find(r => hoursLeft(r.deadline, now) >= 0);
  const late = open.filter(r => hoursLeft(r.deadline, now) < 0);
  if (late.length) head += " " + late.length + " past deadline unless already sent.";
  if (next) head += " Next deadline: " + next.deadline_words + " (" + leftWords(hoursLeft(next.deadline, now)) + ").";
  document.getElementById("headline").textContent = head;

  document.getElementById("rows").innerHTML = rows.map(r => {
    let due = '<span class="small">n/a</span>';
    if (r.deadline) {
      const h = hoursLeft(r.deadline, now);
      due = '<span class="when">' + esc(r.deadline_words) + '</span><span class="pill ' + leftClass(h) + '">' + leftWords(h) + '</span>'
          + '<div class="small" style="margin-top:6px">' + esc(r.clock_words) + '</div>';
    }
    const first = r.also_do.slice(0, 4);
    const acts = first.length
      ? '<ul class="actions">' + first.map(c => "<li>" + esc(c.point) + ' <span class="sec">' + esc(c.section) + "</span></li>").join("") + "</ul>"
      : '<span class="small">None the contract requires.</span>';
    return "<tr><td>" + esc(r.customer) + '</td><td><span class="pill ' + r.notify + '">' + (r.notify === "yes" ? "Yes" : "No") + "</span></td><td>"
      + esc(r.why) + "</td><td>" + due + "</td><td>" + acts + '</td><td class="small">' + esc(r.status) + "</td></tr>";
  }).join("");

  const f = DATA.finding;
  document.getElementById("finding").innerHTML = f
    ? "<strong>Separate finding:</strong> " + esc(f) : "";

  const wasOpen = {};
  document.querySelectorAll("#details details").forEach(d => { wasOpen[d.dataset.contract] = d.open; });
  document.getElementById("details").innerHTML = rows.map(r => {
    const left = [], right = [];
    if (r.evidence.length) left.push("<section><h3>Contract wording behind the decision</h3>" + list(r.evidence, cited) + "</section>");
    if (r.legal_flags.length) left.push("<section><h3>For legal</h3>" + list(r.legal_flags, cited) + "</section>");
    if (r.also_do.length > 4) left.push("<section><h3>Also required</h3>" + list(r.also_do.slice(4), c => esc(c.point) + ' <span class="sec">' + esc(c.section) + "</span>") + "</section>");
    if (r.notice_draft) {
      const d = r.notice_draft;
      right.push('<section><h3>Draft notice</h3><p class="draftmark">Draft for counsel. Not sent.</p><pre class="draft">'
        + esc("To: " + d.to.join(", ") + "\nSubject: " + d.subject + "\n\n" + d.body) + "</pre></section>");
    }
    if (r.open_questions.length) right.push("<section><h3>Open questions</h3>" + list(r.open_questions, esc) + "</section>");
    right.push('<section><h3>Batches at the vendor</h3><ul><li>Held: ' + esc(r.batches_held.join(", ") || "none")
      + "</li><li>Deleted before the incident: " + esc(r.batches_gone.join(", ") || "none") + "</li></ul></section>");
    const isOpen = r.contract in wasOpen ? wasOpen[r.contract] : r.contract === "ANB";
    return '<details data-contract="' + esc(r.contract) + '"' + (isOpen ? " open" : "") + "><summary>" + esc(r.customer) + '</summary><div class="detail"><div>'
      + left.join("") + "</div><div>" + right.join("") + "</div></div></details>";
  }).join("");
}

function showTab(name) {
  ["memo", "demo"].forEach(t => {
    document.getElementById(t + "-panel").hidden = t !== name;
    document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
  });
}
function route() { showTab(location.hash === "#demo" ? "demo" : "memo"); window.scrollTo(0, 0); }
document.getElementById("tab-memo").addEventListener("click", () => { location.hash = "memo"; route(); });
document.getElementById("tab-demo").addEventListener("click", () => { location.hash = "demo"; route(); });
window.addEventListener("hashchange", route);

document.getElementById("report").textContent = DATA.report;
document.getElementById("note").textContent = DATA.note;
render();
route();
</script>
</body>
</html>
